<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            text-align: center;
            justify-content: center;
        }

        input {
            width: 150px;
        }

        button {
            background-color: rgb(182, 182, 251);
            height: 30px;
            width: 90px;
            border: 2px solid rgb(125, 125, 255);
            border-radius: 10px;
            box-shadow: 0px 3px 10px rgb(153, 153, 234);
        }
        button :hover{
            transform: translateY(5px);
        }
    </style>
</head>

<body>
    <div>
        <h1>Guess the number between 1 to 10</h1>

        <p>Computer : <span id="comGuess">will guess the number</span></p>
        <input type="text" id="inputField" placeholder="Enter your number">

        <button onclick="fetchInputValue()" id="btn">Click here</button>

        <p id="win">You win</p>
        <p id="loose">You loose</p>
    </div>
    <script src="./game.js"></script>
</body>

</html>
