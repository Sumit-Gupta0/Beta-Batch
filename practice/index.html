<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <div class="nav-container">
            <div class="nav-logo">
                <img src="Group.png" alt="logo">
            </div>

            <ul>
                <li>Course</li>
                <li>Career Path</li>
                <li>Playground</li>
            </ul>

            <div class="nav-btn">
                <div class="nav-login">
                    <h5>Login</h5>
                </div>

                <div class="nav-start-btn">
                    <button>Get Started</button>
                </div>
            </div>
        </div>
    </nav>

    <main>
        <div class="main-container">
            <div class="user-img">
                <img src="user-img.png" alt="user-img">
            </div>

            <div class="main-head">
                <h3>Arin Bagul</h3>
                <p>@arinbagul</p>
            </div>

            <div class="select">
                <div class="personal-info">
                    <img src="personal-icon.png" alt="icon">
                    <p>Personal Info</p>
                </div>
                <div class="history">
                    <img src="history-icon.png" alt="icon">
                    <p>History</p>
                </div>
            </div>

            <div class="user-info">
                <input type="text" placeholder="User name" required>
                <input type="text" placeholder="User email" required>
                <input type="text" placeholder="User contact" required>
                <input type="text" placeholder="College/University name" required>
                <input type="password" placeholder="Password" required>
                <a href="#"><p>Change Password</p></a>
                <button>Update</button>
            </div>
        </div>

        <p style="margin: 40px;">© 2025 The Entangle</p>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"
        integrity="sha512-NcZdtrT77bJr4STcmsGAESr06BYGE8woZdSdEgqnpyqac7sugNO+Tr4bGwGF3MsnEkGKhU2KL2xh6Ec+BqsaHA=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"
        integrity="sha512-P2IDYZfqSwjcSjX0BKeNhwRUH8zRPGlgcWl5n6gBLzdi4Y5/0O4zaXrtO4K9TZK6Hn1BenYpKowuCavNandERg=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="main.js"></script>
</body>

</html>
